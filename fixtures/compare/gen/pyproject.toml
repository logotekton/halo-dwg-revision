[project]
name = "compare-fixtures-gen"
version = "0.1.0"
description = "Deterministic synthetic revision-pair (before/after DXF + truth.json) generator for Halo CAD compare engine tests (R1-07)"
requires-python = ">=3.12"
dependencies = [
    "ezdxf==1.4.4",
]

[project.scripts]
compare-fixtures-gen = "compare_fixtures_gen.cli:run"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
    "referencing>=0.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
