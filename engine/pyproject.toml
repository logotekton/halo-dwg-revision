[project]
name = "halo_engine"
version = "0.0.1"
description = "Halo CAD Python engine — quantity takeoff and 3D reconstruction sidecar"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ezdxf==1.4.4",
  "shapely==2.1.2",
  "manifold3d==3.5.2",
  "trimesh==5.1.0",
  "ifcopenshell==0.8.5",
  "numpy>=2,<3",
  "openpyxl==3.1.5",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "alembic==1.19.1",
  "typer==0.27.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.167.1",
  "ruff==0.16.5",
  "mypy==2.3.1",
  "jsonschema==4.25.1",
  "referencing==0.36.2",
]

[project.scripts]
halo-engine = "halo_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/halo_engine"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["halo_engine.model.*", "halo_engine.rules.*", "halo_engine.geometry.*"]
strict = true

[[tool.mypy.overrides]]
# ezdxf ships incomplete/inconsistent __all__ re-exports and its entity
# classes are only meaningfully typed as their concrete subclass (Line,
# Hatch, Insert, ...), never the DXFGraphic base ingest code iterates as --
# treat it as untyped rather than chasing attr-defined noise on every access.
module = ["ezdxf", "ezdxf.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
