[project]
name = "fixtures-gen"
version = "0.1.0"
description = "Deterministic synthetic DXF fixture generator for Halo CAD (W1-03)"
requires-python = ">=3.12"
dependencies = [
    "ezdxf==1.4.4",
]

[project.scripts]
fixtures-gen = "fixtures_gen.cli:run"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
