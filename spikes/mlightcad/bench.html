<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>W2-06 large-file bench</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { display: flex; height: 100%; }
      #cad { flex: 1 1 auto; position: relative; background: #1b1b1f; min-width: 0; }
      #side { width: 420px; flex: none; border-left: 1px solid #333; display: flex; flex-direction: column; background: #111; color: #ddd; }
      #log { flex: 1 1 auto; overflow: auto; padding: 6px; white-space: pre-wrap; word-break: break-all; }
      h1 { font-size: 13px; margin: 0; padding: 6px; border-bottom: 1px solid #333; background: #191922; }
      .ok { color: #7ddc7d; } .bad { color: #ff8080; } .warn { color: #ffd479; }
    </style>
  </head>
  <body>
    <!--
      W2-06 benchmark harness. Driven headlessly by scripts/bench-browser.mjs;
      there are no buttons on purpose (every step is one awaited `window.__bench.*`
      call so the driver can bracket it with process-RSS samples).
    -->
    <div id="app">
      <div id="cad"></div>
      <div id="side">
        <h1>W2-06 · large-file bench</h1>
        <div id="log"></div>
      </div>
    </div>
    <script type="module" src="/src/bench.ts"></script>
  </body>
</html>
